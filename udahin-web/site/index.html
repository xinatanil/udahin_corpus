<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yudakhin Dictionary</title>
    <meta
      name="description"
      content="Кыргызско-русский словарь Юдахина в веб-формате."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <div class="site-brand">
          <h1 class="site-brand__title">Yudakhin Dictionary Public Beta</h1>
        </div>

        <form class="search-form" id="search-form" autocomplete="off">
          <div class="search-row">
            <input
              id="search-input"
              name="q"
              type="search"
              placeholder="Найти слово, например, кара"
              spellcheck="false"
            />
            <button type="submit">Search</button>
          </div>
          <ul class="search-results" id="search-results" hidden></ul>
        </form>
      </div>
    </header>

    <main class="page-shell">
      <section class="status-bar" id="status-bar">
        <span id="status-text">Loading dictionary index…</span>
      </section>

      <article class="card-shell" id="card-shell">
        <div class="empty-state" id="empty-state">
          <h2>Type a word to begin</h2>
          <p>
            The site loads a compact search index first and then fetches only the
            matching card data.
          </p>
        </div>

        <div class="card-view" id="card-view" hidden></div>
      </article>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
